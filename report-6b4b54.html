<style>
:root{--ink:#14201d;--muted:#6b7f79;--line:#dfe5e2;--line-2:#eef2f0;--paper:#faf9f7;--surface:#fff;
 --accent:#0b5d51;--good:#1a6b3c;--bad:#96331f;--warn-soft:#fdf3e2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
main{max-width:800px;margin:0 auto;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.25rem;margin:0 0 1rem}
.check{border-inline-start:4px solid var(--line)}
.check.ok{border-inline-start-color:var(--good)}
.check.bad{border-inline-start-color:var(--bad)}
.check h1{margin:0 0 .35rem;font-size:17px;line-height:1.35}
.check p{margin:.35rem 0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.actions a{display:inline-block;padding:.55rem 1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.actions a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.quiet{font-size:12.5px;color:var(--muted);margin:.5rem 0 1.5rem}
/* The report, as the candidate's own screen draws it. */
.report{container-type:inline-size}
.report h2{margin:0;font-size:19px;letter-spacing:-.01em}
.report h3{clear:both;font-size:14.5px;margin:1.3rem 0 .45rem;padding-bottom:.25rem;border-bottom:1px solid var(--line-2)}
.rp-eyebrow{margin:0 0 .2rem;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rp-exam{margin:.15rem 0 0;font-size:15px}
.rp-specimen{margin:.3rem 0 0;font-size:12.5px;font-weight:700;color:#c0392b}
.rp-qr{float:right;width:132px;margin:0 0 .6rem 1.2rem;text-align:center}
.rp-qr svg{display:block;width:100%;height:auto}
.rp-qr figcaption{margin-top:.1rem;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@container (max-width:420px){ .rp-qr{float:none;margin:0 auto .8rem} }
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:14px;margin:1rem 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
@container (min-width:600px){ .rp-facts{grid-template-columns:auto 1fr auto 1fr} }
.rp-p,.rp-list li{text-align:justify;-webkit-hyphens:auto;hyphens:auto;font-size:14.5px;line-height:1.6;margin:.3rem 0}
.rp-note{font-size:13px;color:var(--muted);text-align:justify;-webkit-hyphens:auto;hyphens:auto;margin:.45rem 0}
.rp-list{margin:.2rem 0;padding-inline-start:1.2rem}
.rp-sub{margin:.75rem 0 0;font-size:12.5px;color:var(--muted)}
.report h3 + .rp-sub{margin-top:.35rem}
.rp-scroll{overflow-x:auto}
.rp-table{width:100%;border-collapse:collapse;font-size:13.5px}
.rp-table th{background:var(--line-2);text-align:start;font-weight:600}
.rp-table th,.rp-table td{border-bottom:1px solid var(--line);padding:.4rem .55rem;vertical-align:top}
.rp-table tr.cur td{background:var(--warn-soft);font-weight:600}
.lvl-Strong{color:var(--good);font-weight:600}
.lvl-Satisfactory{font-weight:600}
.lvl-Developing{color:var(--bad);font-weight:600}
.lvl-few{color:var(--muted);font-style:italic}

<script type="application/json" id="exam">{"brand":"RITEPath: Resident-In-Training-Examination in Anatomic Pathology","title":"Examination","mode":"exam","pass":50,"timeMode":"exam","mins":60,"secs":60,"nextPass":"","nextFail":"","reportAxes":[{"label":"Organ system","noun":"organ system","plural":"organ systems"},{"label":"Competency","noun":"competency","plural":"competencies"},{"label":"Bloom level","noun":"Bloom level","plural":"Bloom levels"}],"reportPage":{"url":"https://issamfrancis.github.io/qpc-reports/report-6b4b54.html","id":"6b4b54","areas":[["Breast","Cardiovascular","Dermatologic","Endocrine","Gastrointestinal","General/Multisystem (Laboratory Management)","Gynecologic","Head & Neck","Hematopoietic/Lymphoid","Hepatobiliary","Male Reproductive","Musculoskeletal (Bone & Soft Tissue)","Neuropathology/CNS","Ocular/Adnexal","Pancreatic","Pediatric/Placental","Renal/Genitourinary","Respiratory/Pulmonary"],["Interpersonal and Communication Skills","Medical Knowledge","Patient Care","Practice-Based Learning and Improvement","Professionalism","Systems-Based Practice"],["Analyze","Apply","Create","Evaluate","Remember","Understand"]]}}</script>
<script>
'use strict';
function qrMatrix(text, ecl){
  ecl = ecl || 'M';
  /* The format information spells the level out in its own code, which is not the table order:
     L is 01, M is 00, Q is 11, H is 10. Getting this wrong makes a code that reads back
     correctly to its own author and is refused by every scanner. */
  const ECI = { L:1, M:0, Q:3, H:2 }[ecl];
  /* ISO/IEC 18004 tables, versions 1-20: error-correction codewords per block, and blocks. */
  const ECC = {
    L:[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28],
    M:[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26],
    Q:[13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30],
    H:[17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28] };
  const BLK = {
    L:[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8],
    M:[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16],
    Q:[1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20],
    H:[1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25] };
  const ALIGN = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
                 [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],
                 [6,30,56,82],[6,30,58,86],[6,34,62,90]];

  /* --- the bytes to carry --- */
  const utf8 = [];
  { const s = unescape(encodeURIComponent(String(text)));
    for(let i = 0; i < s.length; i++) utf8.push(s.charCodeAt(i)); }

  const totalCodewords = v => {
    const size = 17 + 4 * v;
    let n = size * size;
    n -= 3 * 64;                                   /* three finder patterns with separators */
    n -= (v >= 7 ? 67 : 31);                       /* format and version information */
    n -= 2 * (size - 16);                          /* timing patterns */
    const a = ALIGN[v - 1].length;
    if(a) n -= (a * a - 3) * 25 - (a - 2) * 2 * 5;
    return Math.floor(n / 8);
  };

  /* --- the smallest version that holds it --- */
  let ver = 0, dataCw = 0;
  for(let v = 1; v <= 20; v++){
    const cw = totalCodewords(v) - ECC[ecl][v - 1] * BLK[ecl][v - 1];
    const lenBits = v < 10 ? 8 : 16;
    if(utf8.length + Math.ceil((4 + lenBits) / 8) <= cw){ ver = v; dataCw = cw; break; }
  }
  if(!ver) throw new Error('too much for one QR code');
  const size = 17 + 4 * ver;

  /* --- bit stream --- */
  const bits = [];
  const put = (val, n) => { for(let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4);
  put(utf8.length, ver < 10 ? 8 : 16);
  utf8.forEach(b => put(b, 8));
  for(let i = 0; i < 4 && bits.length < dataCw * 8; i++) bits.push(0);
  while(bits.length % 8) bits.push(0);
  const data = [];
  for(let i = 0; i < bits.length; i += 8){
    let b = 0; for(let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    data.push(b);
  }
  for(let pad = 0; data.length < dataCw; pad++) data.push(pad % 2 ? 0x11 : 0xEC);

  /* --- Reed-Solomon over GF(256) --- */
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for(let i = 0, x = 1; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if(x & 0x100) x ^= 0x11D; }
  for(let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  const genPoly = n => {
    let g = [1];
    for(let i = 0; i < n; i++){
      const next = new Array(g.length + 1).fill(0);
      for(let j = 0; j < g.length; j++){
        next[j] ^= g[j];                       /* the x term keeps its place */
        next[j + 1] ^= mul(g[j], EXP[i]);      /* the constant term drops one power */
      }
      g = next;
    }
    return g;
  };
  const remainder = (block, n) => {
    const g = genPoly(n), out = new Array(n).fill(0);
    block.forEach(b => {
      const factor = b ^ out[0];
      out.shift(); out.push(0);
      for(let i = 0; i < n; i++) out[i] ^= mul(g[i + 1], factor);
    });
    return out;
  };

  /* --- split into blocks, then interleave --- */
  const nBlocks = BLK[ecl][ver - 1], ecLen = ECC[ecl][ver - 1];
  const short = Math.floor(dataCw / nBlocks), extra = dataCw % nBlocks;
  const dBlocks = [], eBlocks = [];
  for(let i = 0, at = 0; i < nBlocks; i++){
    const len = short + (i >= nBlocks - extra ? 1 : 0);
    const blk = data.slice(at, at + len); at += len;
    dBlocks.push(blk); eBlocks.push(remainder(blk, ecLen));
  }
  const final = [];
  for(let i = 0; i < short + 1; i++) dBlocks.forEach(b => { if(i < b.length) final.push(b[i]); });
  for(let i = 0; i < ecLen; i++) eBlocks.forEach(b => final.push(b[i]));

  /* --- the matrix --- */
  const m = [], used = [];
  for(let y = 0; y < size; y++){ m.push(new Array(size).fill(0)); used.push(new Array(size).fill(0)); }
  const set = (x, y, v) => { if(x >= 0 && y >= 0 && x < size && y < size){ m[y][x] = v ? 1 : 0; used[y][x] = 1; } };
  const finder = (cx, cy) => {
    for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      set(cx + dx, cy + dy, d !== 2 && d <= 3 ? 1 : 0);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  for(let i = 8; i < size - 8; i++){ set(i, 6, (i % 2) === 0); set(6, i, (i % 2) === 0); }
  const ap = ALIGN[ver - 1];
  ap.forEach(ax => ap.forEach(ay => {
    if((ax < 8 && ay < 8) || (ax < 8 && ay > size - 9) || (ax > size - 9 && ay < 8)) return;
    for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++)
      set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  set(8, size - 8, 1);                                   /* the dark module */
  for(let i = 0; i < 9; i++){ if(!used[i][8]) used[i][8] = 1; if(!used[8][i]) used[8][i] = 1; }
  for(let i = 0; i < 8; i++){ used[size - 1 - i][8] = 1; used[8][size - 1 - i] = 1; }
  if(ver >= 7) for(let i = 0; i < 6; i++) for(let j = 0; j < 3; j++){
    used[i][size - 11 + j] = 1; used[size - 11 + j][i] = 1;
  }

  /* --- lay the codewords in --- */
  let bitAt = 0;
  const stream = [];
  final.forEach(b => { for(let i = 7; i >= 0; i--) stream.push((b >>> i) & 1); });
  let upward = true;
  for(let col = size - 1; col > 0; col -= 2){
    if(col === 6) col--;
    for(let r = 0; r < size; r++){
      const y = upward ? size - 1 - r : r;
      for(let c = 0; c < 2; c++){
        const x = col - c;
        if(used[y][x]) continue;
        m[y][x] = bitAt < stream.length ? stream[bitAt++] : 0;
      }
    }
    upward = !upward;
  }

  /* --- masking: every pattern is scored, the quietest wins --- */
  const maskFn = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0 ];
  const penalty = g => {
    let p = 0;
    for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
      if(x < size - 1 && y < size - 1 && g[y][x] === g[y][x+1] && g[y][x] === g[y+1][x] && g[y][x] === g[y+1][x+1]) p += 3;
    }
    const run = line => {
      let n = 1, out = 0;
      for(let i = 1; i < line.length; i++){
        if(line[i] === line[i-1]) n++;
        else { if(n >= 5) out += 3 + (n - 5); n = 1; }
      }
      if(n >= 5) out += 3 + (n - 5);
      return out;
    };
    for(let y = 0; y < size; y++) p += run(g[y]);
    for(let x = 0; x < size; x++) p += run(g.map(r => r[x]));
    let dark = 0;
    g.forEach(r => r.forEach(v => dark += v));
    p += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
    return p;
  };
  const fmtBits = mask => {
    const v = (ECI << 3) | mask;
    let rem = v;
    for(let i = 0; i < 10; i++) rem = ((rem << 1) ^ (((rem >>> 9) & 1) * 0x537)) & 0x3FF;
    return (((v << 10) | rem) ^ 0x5412) & 0x7FFF;
  };
  let best = null, bestScore = Infinity;
  for(let mask = 0; mask < 8; mask++){
    const g = m.map(r => r.slice());
    for(let y = 0; y < size; y++) for(let x = 0; x < size; x++)
      if(!used[y][x] && maskFn[mask](x, y)) g[y][x] ^= 1;
    const f = fmtBits(mask);
    for(let i = 0; i < 15; i++){
      const b = (f >>> i) & 1;
      /* the copy that wraps the top-left finder */
      if(i < 6) g[i][8] = b;
      else if(i === 6) g[7][8] = b;
      else if(i === 7) g[8][8] = b;
      else if(i === 8) g[8][7] = b;
      else g[8][14 - i] = b;
      /* and the copy split between the other two */
      if(i < 8) g[8][size - 1 - i] = b;
      else g[size - 15 + i][8] = b;
    }
    g[size - 8][8] = 1;
    if(ver >= 7){
      let rem = ver;
      for(let i = 0; i < 12; i++) rem = ((rem << 1) ^ (((rem >>> 11) & 1) * 0x1F25)) & 0xFFF;
      const vinfo = (ver << 12) | rem;
      for(let i = 0; i < 18; i++){
        const b = (vinfo >>> i) & 1, a = Math.floor(i / 3), c = i % 3;
        g[a][size - 11 + c] = b; g[size - 11 + c][a] = b;
      }
    }
    const s = penalty(g);
    if(s < bestScore){ bestScore = s; best = g; }
  }
  return best;
}

function reportQrText(S, res, rep){
  const page = S.reportPage, when = new Date(res.submitted);
  if(!(page && page.url)) return '';
  const e = x => encodeURIComponent(String(x == null ? '' : x)), two = n => (n < 10 ? '0' : '') + n;
  /* The day the candidate's own clock gave, which is the day their report prints. */
  const day = isNaN(when) ? '' : when.getFullYear() + two(when.getMonth() + 1) + two(when.getDate());
  const counts = page.areas.map((names, j) => {
    const got = new Map((((rep && rep.axes) || [])[j] || { domains: [] }).domains.map(d => [d.name, d]));
    return names.map(name => got.has(name) ? got.get(name).n + '.' + got.get(name).right : '0.0').join('.');
  });
  return page.url + '#' + ['r1', page.id, res.specimen ? 's' : '', e(res.name), e(res.college), e(res.year), day,
    e(res.minutes), e(res.auto), res.correct, res.total, e(res.code)].concat(counts).join(',');
}

function reportModel(S, res, rep){
  rep = rep || {};
  const MIN = 5;                                  /* questions an area needs before it is judged */
  const pass = Number(res.pass) || 0, pct = Number(res.percent) || 0;
  const a = Math.max(90, pass), b = Math.max(75, pass);
  const bands = [{ g:'A', range: a >= 100 ? '100%' : a + '–100%', meaning:'Excellent command of the material examined' }];
  if(b < a) bands.push({ g:'B', range: b + '% to under ' + a + '%', meaning:'Strong performance, well above the pass mark' });
  if(pass < b) bands.push({ g:'C', range: pass + '% to under ' + b + '%', meaning:'A pass on a satisfactory foundation, with some development needed' });
  if(pass > 0) bands.push({ g:'D', range:'Under ' + pass + '%', meaning:'Below the pass mark: further study and review recommended' });
  const grade = !res.passed ? 'D' : pct >= a ? 'A' : pct >= b ? 'B' : 'C';
  const list = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  const count = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const score = x => x.right + ' of ' + x.n + ' correct (' + x.pr + '%)';

  /* Each classification has its own table, strengths and areas to develop. One that no question on
     this paper carries is left out, so a paper classified in one way only reads exactly as a report
     by that classification alone. */
  const tallies = (rep.axes || []).filter(t => (t.domains || []).length), several = tallies.length > 1;
  const axes = tallies.map(t => {
    const noun = t.noun || 'area', label = t.label || 'Area';
    /* Beside other tables, "best" and "lowest" mean within this classification, and say so. */
    const within = several ? 'among the ' + (t.plural || noun) : 'on this paper';
    const areas = t.domains.map(d => {
      const n = Number(d.n) || 0, right = Number(d.right) || 0, p = n ? right / n * 100 : 0;
      const judged = n >= MIN;
      return { name: String(d.name), n, right, p, pr: Math.round(p), judged,
               level: !judged ? '' : p >= b ? 'Strong' : p >= pass ? 'Satisfactory' : 'Developing' };
    }).sort((x, y) => x.name.localeCompare(y.name));
    const judged = areas.filter(x => x.judged);
    const best = judged.slice().sort((x, y) => y.p - x.p || y.n - x.n || x.name.localeCompare(y.name));
    const worst = judged.slice().sort((x, y) => x.p - y.p || y.n - x.n || x.name.localeCompare(y.name));

    /* Strengths are areas in the strong range; failing that, the best area if it at least passed. Areas
       to develop are those below the pass mark; failing that, the lowest one not already a strength. */
    let strengths = best.filter(x => x.level === 'Strong').slice(0, 3).map(x => [x.name, score(x) + '.']);
    if(!strengths.length && best.length && best[0].level === 'Satisfactory')
      strengths = [[best[0].name, score(best[0]) + ', your best result ' + within + '.']];
    let develop = worst.filter(x => x.level === 'Developing').slice(0, 3).map(x => [x.name, score(x) + ', below the pass mark.']);
    if(!develop.length){
      const low = worst.find(x => x.level === 'Satisfactory' && !strengths.some(s => s[0] === x.name));
      if(low) develop = [[low.name, score(low) + ', your lowest result ' + within + '.']];
    }
    const strengthsNote = strengths.length || !judged.length ? '' : 'No ' + noun + ' reached the pass mark on this paper.';
    const developNote = develop.length || !judged.length ? ''
      : judged.every(x => x.level === 'Strong') ? 'Every ' + noun + ' with enough questions to judge was in the strong range.'
      : 'No ' + noun + ' fell below the pass mark.';

    /* What the overall paragraph says of this classification: led by its name when there are others. */
    const strong = strengths.length ? 'your strongest ' + (strengths.length === 1 ? 'result was' : 'results were') + ' in ' + list(strengths.map(s => s[0])) : '';
    const room = develop.length ? (develop.length === 1 ? 'the area with most room to improve is ' : 'the areas with most room to improve are ')
      + list(develop.map(d => d[0])) : '';
    const summary = !judged.length ? 'Each ' + noun + ' on this paper had fewer than ' + MIN + ' questions, too few to break your result down reliably.'
      : several ? 'By ' + noun + ', ' + [strong, room].filter(Boolean).join(', and ') + '.'
      : [strong, room].filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1) + '.').join(' ');

    const few = areas.length - judged.length, untagged = Number(t.untagged) || 0;
    const areaNote = [
      few ? 'A level is given only where the paper had at least ' + MIN + ' questions in that ' + noun + '; fewer is too few to judge.' : '',
      untagged ? count(untagged, 'question', 'questions') + ' on this paper ' + (untagged === 1 ? 'carries' : 'carry') + ' no ' + noun
        + ' and ' + (untagged === 1 ? 'counts' : 'count') + ' in your overall score only.' : ''
    ].filter(Boolean).join(' ');
    return { label, noun, areas, judged: judged.length, areaNote, strengths, strengthsNote, develop, developNote, summary };
  });

  const desc = { A:'an excellent', B:'a strong', C:'a satisfactory' }[grade];
  const overall = ['You answered ' + res.correct + ' of ' + res.total + ' questions correctly (' + pct + '%), which is grade ' + grade + '.',
    res.passed ? 'The pass mark was ' + pass + '%, so you passed, with ' + desc + ' level of performance across the paper.'
               : 'The pass mark was ' + pass + '%, so this attempt did not reach it.'].concat(axes.map(ax => ax.summary)).filter(Boolean).join(' ');
  /* One suggested action, naming the areas to develop under every classification. */
  const toDevelop = axes.reduce((xs, ax) => xs.concat(ax.develop.map(d => d[0]).filter(n => !xs.includes(n))), []);
  const action = toDevelop.length
    ? 'Suggested action: work through ' + list(toDevelop) + ' against the curriculum and your reading list, then practise with questions in '
      + (toDevelop.length === 1 ? 'that area' : 'those areas') + ' before your next assessment.'
    : '';

  const when = new Date(res.submitted);
  const day = isNaN(when) ? '' : when.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  const mins = Number(res.minutes) || 0;
  const took = mins < 1 ? 'Under a minute' : count(Math.round(mins), 'minute', 'minutes');
  const allowed = rep.allowed === undefined ? '' : rep.allowed ? ' (' + rep.allowed + ' allowed)' : ' (no time limit)';
  const facts = [['Candidate', res.name || '']];
  if(res.college) facts.push(['College', res.college]);
  if(res.year) facts.push(['Training year', String(res.year)]);
  facts.push(['Assessment date', day]);
  facts.push(['Submitted', res.auto ? 'Automatically — ' + res.auto : 'By you']);
  facts.push(['Time taken', took + allowed]);
  facts.push(['Overall result', pct + '% — grade ' + grade]);
  facts.push(['Outcome', (res.passed ? 'Passed' : 'Not passed') + ' (pass mark ' + pass + '%)']);
  if(res.code) facts.push(['Verification code', res.code]);

  const next = String((res.passed ? S.nextPass : S.nextFail) || '').trim() || (res.passed
    ? 'Keep your study going across the whole curriculum, giving most time to your weaker areas, before your next in-training examination.'
    : 'Arrange to discuss this result with your programme director or supervisor, and agree a study plan for your weaker areas before you are reassessed.');
  const note = 'This report describes your performance on this paper only. '
    + (axes.length ? 'The score for each ' + list(axes.map(ax => ax.noun)) + ' rests on the few questions it had, so read it as a guide to where to focus your study rather than a verdict on that area. ' : '')
    + (S.mode === 'training' ? 'In a training paper each question is scored on your first answer. ' : '')
    + 'Read it alongside your supervisors’ assessments and the rest of your training record, not as the only measure of your progress.';

  return { brand: S.brand || '', exam: res.exam || S.title || '', name: res.name || '', code: res.code || '',
           facts, overall, grade, bands, axes, several, judged: axes.reduce((n, ax) => n + ax.judged, 0),
           action, next, note, qr: reportQrText(S, res, rep), specimen: !!res.specimen };
}

function reportPdf(m){
  const K = 72 / 25.4, PW = 595.28, PH = 841.89;
  const ML = 20 * K, MR = PW - 20 * K, WIDTH = MR - ML, TOP = PH - 16 * K, BOTTOM = 19 * K;
  const INK = '#14181d', QUIET = '#5b636d', RULE = '#c9d1ce', HEAD = '#eef2f0', MARK = '#fbf1dc';
  const LEVEL = { Strong:'#1a6b3c', Developing:'#96331f' };
  const W = {
    F1:[250,333,408,500,500,833,778,180,333,333,500,564,250,333,250,278,500,500,500,500,500,500,500,500,500,500,278,278,564,564,564,444,921,722,667,667,722,611,556,722,722,333,389,722,611,889,722,722,556,722,667,556,611,722,722,944,722,722,611,333,278,333,469,500,333,444,500,444,500,444,333,500,500,278,278,500,278,778,500,500,500,500,333,389,278,500,500,722,500,500,444,480,200,480,541],
    F2:[250,333,555,500,500,1000,833,278,333,333,500,570,250,333,250,278,500,500,500,500,500,500,500,500,500,500,333,333,570,570,570,500,930,722,667,722,722,667,611,778,778,389,500,778,667,944,722,778,611,778,722,556,667,722,722,1000,722,722,667,333,278,333,581,500,333,500,556,444,556,444,333,500,556,278,333,556,278,833,556,500,556,556,444,389,333,556,500,722,500,500,444,394,220,394,520],
    F3:[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
    F4:[250,333,420,500,500,833,778,214,333,333,500,675,250,333,250,278,500,500,500,500,500,500,500,500,500,500,333,333,675,675,675,500,920,611,611,667,722,611,611,722,722,333,444,667,556,833,667,722,611,722,611,500,556,722,611,833,611,556,556,389,278,389,422,500,333,500,500,444,500,444,278,500,500,278,278,444,278,722,500,500,500,500,389,389,278,500,444,667,444,444,389,400,275,400,541] };
  const WIN = { 0x2013:0x96, 0x2014:0x97, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2026:0x85, 0x00B7:0xB7, 0x00A0:0x20 };
  const WIDE = { 0x97:1000, 0x96:500, 0x95:350, 0x91:333, 0x92:333, 0x93:444, 0x94:444, 0x85:1000, 0xB7:250 };
  const toWin = s => {
    let out = '';
    for(const ch of String(s == null ? '' : s)){
      const c = ch.codePointAt(0);
      out += String.fromCharCode(WIN[c] !== undefined ? WIN[c] : (c < 256 ? c : 63));
    }
    return out;
  };
  const widthOf = (s, f, size) => {
    let w = 0;
    for(let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); w += (c >= 32 && c <= 126) ? W[f][c - 32] : (WIDE[c] || 500); }
    return w * size / 1000;
  };
  const esc = s => s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const rgb = hex => [0, 2, 4].map(i => (parseInt(hex.slice(1 + i, 3 + i), 16) / 255).toFixed(3)).join(' ');

  const pages = [];
  let ops = null, y = 0;
  const newPage = () => { ops = []; pages.push(ops); y = TOP; };
  const room = h => { if(y - h < BOTTOM) newPage(); };
  /* `t` is already in the PDF's own encoding. */
  const put = (t, f, size, x, yy, hex) => {
    if(t) ops.push(rgb(hex || INK) + ' rg BT /' + f + ' ' + size + ' Tf 1 0 0 1 ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Tm (' + esc(t) + ') Tj ET');
  };
  const box = (x, yy, w, h, hex) => ops.push(rgb(hex) + ' rg ' + [x, yy, w, h].map(v => v.toFixed(2)).join(' ') + ' re f');
  const rule = (yy, hex, wd) => ops.push(rgb(hex || RULE) + ' RG ' + (wd || 0.6) + ' w ' + ML.toFixed(2) + ' ' + yy.toFixed(2)
                                         + ' m ' + MR.toFixed(2) + ' ' + yy.toFixed(2) + ' l S');
  /* Runs of text broken into lines no wider than maxW. The join between two runs is a space. */
  const wrap = (runs, size, maxW) => {
    const words = [];
    runs.forEach(r => toWin(r.t).split(/\s+/).forEach(t => { if(t) words.push({ t, f: r.f, c: r.c, w: widthOf(t, r.f, size) }); }));
    const sp = widthOf(' ', 'F1', size), out = [];
    let cur = [], w = 0;
    words.forEach(x => {
      const add = cur.length ? sp + x.w : x.w;
      if(cur.length && w + add > maxW){ out.push({ words: cur, w }); cur = [x]; w = x.w; }
      else { cur.push(x); w += add; }
    });
    if(cur.length) out.push({ words: cur, w, last: true });
    return { out, sp };
  };
  const para = (runs, o) => {
    o = o || {};
    const size = o.size || 10.5, lead = o.lead || size * 1.4, x0 = ML + (o.indent || 0), maxW = WIDTH - (o.indent || 0) - (o.right || 0);
    const { out, sp } = wrap(runs, size, maxW);
    out.forEach((ln, i) => {
      room(lead);
      y -= lead;
      if(i === 0 && o.bullet) put('\x95', 'F1', size, ML + 1.5 * K, y, QUIET);
      const gaps = ln.words.length - 1;
      const extra = o.justify && !ln.last && gaps > 0 ? (maxW - ln.w) / gaps : 0;
      let x = x0;
      ln.words.forEach(wd => { put(wd.t, wd.f, size, x, y, wd.c || o.color); x += wd.w + sp + extra; });
    });
    y -= o.after === undefined ? 3 : o.after;
  };
  /* Never a heading alone at the foot of a page: it keeps `keep` points of what follows with it, a line
     of text unless told more. A table's heading keeps the room the table asks for. */
  const heading = (t, keep) => {
    room(23 + (keep || 29));
    y -= 16;
    put(toWin(t), 'F2', 12.5, ML, y);
    y -= 5; rule(y, RULE, 0.6); y -= 2;
  };
  /* The name of a classification over its own strengths or areas to develop, kept with its first line.
     No more than that is asked for: the first one sits in the room its heading kept, and asking for
     more would leave the heading alone at the foot of a page. */
  const sub = (t, first) => {
    const gap = first ? 13 : 17;
    room(gap + 16);
    y -= gap;
    put(toWin(t), 'F3', 8.5, ML, y, QUIET);
    y -= 1;
  };
  const table = (head, rows, cols) => {
    const size = 9.5, lead = 11.8, pad = 3.6;
    const xs = []; let at = ML;
    cols.forEach(c => { xs.push(at); at += c * WIDTH; });
    const row = (cells, bg) => {
      const wrapped = cells.map((c, i) => wrap([c], size, cols[i] * WIDTH - pad * 2));
      const n = Math.max(1, ...wrapped.map(w => w.out.length));
      const h = pad * 2 + size + (n - 1) * lead;
      room(h);
      if(bg) box(ML, y - h, WIDTH, h, bg);
      wrapped.forEach((w, i) => {
        let yy = y - pad - size * 0.78;
        w.out.forEach(ln => {
          let x = xs[i] + pad;
          ln.words.forEach(wd => { put(wd.t, wd.f, size, x, yy, wd.c); x += wd.w + w.sp; });
          yy -= lead;
        });
      });
      y -= h;
      rule(y, RULE, 0.4);
    };
    room(40);
    row(head.map(t => ({ t, f:'F2' })), HEAD);
    rows.forEach(r => row(r.cells, r.bg));
    y -= 4;
  };

  newPage();
  /* The QR at the top right, for whoever is handed a copy: scanning it gives the report as the pack
     wrote it, to set beside the one in their hand. It is drawn as rectangles in one path, in units of
     a module, so it is as sharp as the printer and small in the file; 0.55 mm a module, from 30 mm up
     to 42 mm across. The heading keeps clear of it by more than its quiet zone. With no report page
     there is no QR, and the heading has the whole width. */
  const grid = m.qr ? qrMatrix(m.qr, 'M') : [], QN = grid.length;
  const QS = QN ? Math.min(42, Math.max(30, QN * 0.55)) * K : 0, QX = MR - QS;
  if(QN){
    ops.push('q 0 g ' + [QS / QN, 0, 0, QS / QN, QX, TOP - QS].map(v => +v.toFixed(4)).join(' ') + ' cm');
    grid.forEach((row, r) => {
      for(let c = 0; c < QN; ){
        if(!row[c]){ c++; continue; }
        let e = c;
        while(e < QN && row[e]) e++;
        ops.push(c + ' ' + (QN - 1 - r) + ' ' + (e - c) + ' 1 re');
        c = e;
      }
    });
    ops.push('f Q');
    const scan = toWin('SCAN TO VERIFY');
    put(scan, 'F3', 6.5, QX + (QS - widthOf(scan, 'F3', 6.5)) / 2, TOP - QS - 12, QUIET);
  }
  const beside = QN ? QS + 7 * K : 0;
  if(m.brand) para([{ t: m.brand.toUpperCase(), f:'F3' }], { size: 8, lead: 10, color: QUIET, after: 6, right: beside });
  para([{ t:'Performance report', f:'F2' }], { size: 21, lead: 24, after: 2, right: beside });
  if(m.exam) para([{ t: m.exam, f:'F1' }], { size: 13, lead: 16, after: 4, right: beside });
  if(m.specimen) para([{ t:'SPECIMEN — made-up answers, for checking the layout', f:'F2', c:'#c0392b' }], { size: 9, lead: 12, after: 4, right: beside });
  if(QN) y = Math.min(y, TOP - QS - 17);
  y -= 3; rule(y, INK, 0.9); y -= 4;

  /* The particulars in two columns, read across: label, value, label, value. */
  const GAP = 8 * K, HALF = (WIDTH - GAP) / 2, LABEL = 30 * K;
  for(let i = 0; i < m.facts.length; i += 2){
    const cells = [m.facts[i], m.facts[i + 1]].filter(Boolean).map(([k, v], j) => {
      const bold = k === 'Overall result' || k === 'Outcome';
      return { k, x: ML + j * (HALF + GAP), w: wrap([{ t: v, f: bold ? 'F2' : 'F1' }], 10, HALF - LABEL) };
    });
    const n = Math.max(...cells.map(c => c.w.out.length));
    room(13 * n);
    cells.forEach(c => {
      let yy = y;
      c.w.out.forEach((ln, j) => {
        yy -= 13;
        if(j === 0) put(toWin(c.k), 'F3', 8.5, c.x, yy, QUIET);
        let x = c.x + LABEL;
        ln.words.forEach(wd => { put(wd.t, wd.f, 10, x, yy); x += wd.w + c.w.sp; });
      });
    });
    y -= 13 * n;
  }
  y -= 4;

  heading('Overall performance');
  para([{ t: m.overall, f:'F1' }], { justify: true });

  heading('Grade guide', 40);
  table(['Grade', 'Score', 'What it means'],
        m.bands.map(x => ({ cells: [{ t: x.g, f:'F2' }, { t: x.range, f:'F1' }, { t: x.meaning, f:'F1' }], bg: x.g === m.grade ? MARK : '' })),
        [0.13, 0.27, 0.60]);

  m.axes.forEach(ax => {
    heading('Results by ' + ax.noun, 40);
    table([ax.label, 'Score', 'Level'],
          ax.areas.map(x => ({ cells: [{ t: x.name, f:'F1' }, { t: x.right + ' of ' + x.n + ' (' + x.pr + '%)', f:'F1' },
                                       x.judged ? { t: x.level, f:'F2', c: LEVEL[x.level] } : { t:'Too few questions to judge', f:'F4', c: QUIET }] })),
          [0.50, 0.22, 0.28]);
    if(ax.areaNote) para([{ t: ax.areaNote, f:'F4' }], { size: 9.5, color: QUIET, justify: true });
  });
  if(m.judged){
    /* Beside other classifications, each one's strengths and areas to develop sit under its name. */
    const points = (key, note) => m.axes.filter(ax => ax.judged).forEach((ax, i) => {
      if(m.several) sub(ax.label, i === 0);
      if(ax[key].length) ax[key].forEach(([k, v]) => para([{ t: k + ':', f:'F2' }, { t: v, f:'F1' }], { indent: 6 * K, bullet: true, justify: true, after: 1 }));
      else para([{ t: ax[note], f:'F1' }], { justify: true });
    });
    heading('Key strengths');
    points('strengths', 'strengthsNote');
    heading('Areas to develop');
    points('develop', 'developNote');
    if(m.action) para([{ t:'Suggested action:', f:'F2' }, { t: m.action.replace(/^Suggested action:\s*/, ''), f:'F1' }], { justify: true });
  }
  heading('Recommended next step');
  para([{ t: m.next, f:'F1' }], { justify: true });
  heading('About this report');
  para([{ t: m.note, f:'F1' }], { size: 9.5, color: QUIET, justify: true });

  /* Every page carries whose report it is and the code that ties it to the signed result. */
  const foot = toWin((m.name ? m.name + ' · ' : '') + 'Performance report' + (m.code ? ' · Verification ' + m.code : ''));
  pages.forEach((p, i) => {
    ops = p;
    rule(BOTTOM - 8, RULE, 0.4);
    put(foot, 'F3', 7.5, ML, BOTTOM - 17, QUIET);
    const pg = toWin('Page ' + (i + 1) + ' of ' + pages.length);
    put(pg, 'F3', 7.5, MR - widthOf(pg, 'F3', 7.5), BOTTOM - 17, QUIET);
  });

  /* --- assemble the file: catalogue, page tree, four fonts, then each page and its content --- */
  const latin1 = str => { const b = new Uint8Array(str.length); for(let i = 0; i < str.length; i++) b[i] = str.charCodeAt(i) & 0xFF; return b; };
  const parts = [], offsets = [];
  let length = 0;
  const push = chunk => { const b = typeof chunk === 'string' ? latin1(chunk) : chunk; parts.push(b); length += b.length; };
  const obj = (n, body, stream) => {
    offsets[n] = length;
    push(n + ' 0 obj\n' + body + '\n');
    if(stream){ push('stream\n'); push(stream); push('\nendstream\n'); }
    push('endobj\n');
  };
  const FIRST = 7;                                /* page i is object 7 + 2i, its content 8 + 2i */
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + pages.map((_, i) => (FIRST + 2 * i) + ' 0 R').join(' ') + '] /Count ' + pages.length + ' >>');
  [['F1','Times-Roman'],['F2','Times-Bold'],['F3','Helvetica'],['F4','Times-Italic']]
    .forEach(([, base], i) => obj(3 + i, '<< /Type /Font /Subtype /Type1 /BaseFont /' + base + ' /Encoding /WinAnsiEncoding >>'));
  pages.forEach((p, i) => {
    const content = latin1(p.join('\n'));
    obj(FIRST + 2 * i, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) + ']'
        + ' /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ' + (FIRST + 2 * i + 1) + ' 0 R >>');
    obj(FIRST + 2 * i + 1, '<< /Length ' + content.length + ' >>', content);
  });
  const xref = length, top = FIRST + 2 * pages.length;
  let table2 = 'xref\n0 ' + top + '\n0000000000 65535 f \n';
  for(let i = 1; i < top; i++) table2 += String(offsets[i] || 0).padStart(10, '0') + ' 00000 n \n';
  push(table2 + 'trailer\n<< /Size ' + top + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  const out = new Uint8Array(length);
  let at = 0;
  parts.forEach(b => { out.set(b, at); at += b.length; });
  return out;
}

function reportFileName(res){
  const who = String(res.name || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return (who ? who + '-' : '') + 'performance-report.pdf';
}

function reportDom(host, m, heading){
  host.textContent = '';
  const add = (tag, cls, text, parent) => {
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined) n.textContent = text;
    (parent || host).appendChild(n);
    return n;
  };
  const table = (head, rows) => {
    const t = add('table', 'rp-table', undefined, add('div', 'rp-scroll'));
    const tr = add('tr', '', undefined, add('thead', '', undefined, t));
    head.forEach(h => add('th', '', h, tr));
    const body = add('tbody', '', undefined, t);
    rows.forEach(r => {
      const row = add('tr', r.cur ? 'cur' : '', undefined, body);
      r.cells.forEach((c, i) => add('td', r.cls && r.cls[i] ? r.cls[i] : '', c, row));
    });
  };
  const bullets = (list, empty) => {
    if(!list.length){ add('p', 'rp-p', empty); return; }
    const ul = add('ul', 'rp-list');
    list.forEach(x => { const li = add('li', '', undefined, ul); add('b', '', x[0] + ': ', li); li.appendChild(document.createTextNode(x[1])); });
  };
  if(m.qr){
    /* The QR as the PDF draws it: runs of dark modules in one path, on white with its quiet zone, so it
       stays sharp on screen and on paper. */
    const grid = qrMatrix(m.qr, 'M'), n = grid.length, NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'), ground = document.createElementNS(NS, 'rect'), path = document.createElementNS(NS, 'path');
    svg.setAttribute('viewBox', '0 0 ' + (n + 8) + ' ' + (n + 8));
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'QR code of this report');
    ground.setAttribute('width', n + 8); ground.setAttribute('height', n + 8); ground.setAttribute('fill', '#fff');
    let d = '';
    grid.forEach((row, r) => {
      for(let c = 0; c < n; ){
        if(!row[c]){ c++; continue; }
        let e = c;
        while(e < n && row[e]) e++;
        d += 'M' + (c + 4) + ' ' + (r + 4) + 'h' + (e - c) + 'v1h-' + (e - c) + 'z';
        c = e;
      }
    });
    path.setAttribute('d', d); path.setAttribute('fill', '#000');
    svg.appendChild(ground); svg.appendChild(path);
    const figure = add('figure', 'rp-qr');
    figure.appendChild(svg);
    add('figcaption', '', 'Scan to verify', figure);
  }
  if(m.brand) add('p', 'rp-eyebrow', m.brand);
  add('h2', '', heading || 'Performance report');
  if(m.exam) add('p', 'rp-exam', m.exam);
  if(m.specimen) add('p', 'rp-specimen', 'SPECIMEN — made-up answers, for checking the layout');
  const dl = add('dl', 'kv rp-facts');
  m.facts.forEach(f => { add('dt', '', f[0], dl); add('dd', '', f[1], dl); });
  add('h3', '', 'Overall performance');
  add('p', 'rp-p', m.overall);
  add('h3', '', 'Grade guide');
  table(['Grade', 'Score', 'What it means'], m.bands.map(x => ({ cells: [x.g, x.range, x.meaning], cur: x.g === m.grade })));
  m.axes.forEach(ax => {
    add('h3', '', 'Results by ' + ax.noun);
    table([ax.label, 'Score', 'Level'], ax.areas.map(x => ({
      cells: [x.name, x.right + ' of ' + x.n + ' (' + x.pr + '%)', x.judged ? x.level : 'Too few questions to judge'],
      cls: ['', '', x.judged ? 'lvl-' + x.level : 'lvl-few'] })));
    if(ax.areaNote) add('p', 'rp-note', ax.areaNote);
  });
  if(m.judged){
    /* Beside other classifications, each one's strengths and areas to develop sit under its name. */
    const points = (key, note) => m.axes.forEach(ax => {
      if(!ax.judged) return;
      if(m.several) add('p', 'rp-sub', ax.label);
      bullets(ax[key], ax[note]);
    });
    add('h3', '', 'Key strengths');
    points('strengths', 'strengthsNote');
    add('h3', '', 'Areas to develop');
    points('develop', 'developNote');
    if(m.action) add('p', 'rp-p', m.action);
  }
  add('h3', '', 'Recommended next step');
  add('p', 'rp-p', m.next);
  add('h3', '', 'About this report');
  add('p', 'rp-note', m.note);
}

(function(){
  const S = JSON.parse(document.getElementById('exam').textContent), page = S.reportPage;
  const $ = id => document.getElementById(id);
  /* A second report scanned into the same tab changes only what follows the #, which does not reload
     a page: without this, the page would go on showing the first candidate's report. */
  window.addEventListener('hashchange', () => location.reload());
  $('about').textContent = 'This page looks nothing up and sends nothing. Everything it shows comes from the code you scanned, '
    + 'which your browser keeps after the # of the address and does not send to the web. Page version ' + page.id + '.';

  /** The candidate's result and tally, read back from the code exactly as their pack worked them out,
   *  or why they cannot be. Everything read here reaches the page as text, never as markup. */
  function read(hash){
    const f = String(hash || '').replace(/^#/, '').split(',');
    if(f[0] !== 'r1') return { why: 'none' };
    const text = x => { try{ return decodeURIComponent(x || ''); }catch(e){ return ''; } };
    const who = { name: text(f[3]), code: text(f[11]) };
    if(f.length < 12) return { why: 'damaged', who };
    if(f[1] !== page.id) return { why: 'version', who, version: f[1] };
    const whole = x => (/^\d+$/.test(x) ? Number(x) : NaN);
    const date = /^(\d{4})(\d\d)(\d\d)$/.exec(f[6]), correct = whole(f[9]), total = whole(f[10]), minutes = Number(text(f[7]));
    if(f.length !== 12 + page.areas.length || !date || !(total > 0) || !(correct <= total) || !isFinite(minutes)) return { why: 'damaged', who };
    /* A specimen from the console's preview is worked out as the preview works it out. */
    const spec = f[2] === 's', pass = spec ? (Number(S.pass) || 50) : S.pass;
    const percent = Math.round((correct / total) * 10000) / 100;
    const res = { name: who.name, college: text(f[4]), year: text(f[5]), exam: S.title || (spec ? 'Examination' : ''),
                  correct, total, percent, pass, passed: percent >= pass, minutes, auto: text(f[8]), code: who.code, specimen: spec,
                  /* noon on the candidate's day, which is that day wherever the page is read */
                  submitted: new Date(Number(date[1]), Number(date[2]) - 1, Number(date[3]), 12).toISOString() };
    const axes = [];
    for(let j = 0; j < page.areas.length; j++){
      const counts = f[12 + j] ? f[12 + j].split('.').map(whole) : [];
      if(counts.length !== 2 * page.areas[j].length || counts.some(isNaN)) return { why: 'damaged', who };
      const domains = [];
      let tagged = 0;
      page.areas[j].forEach((name, k) => { const n = counts[2 * k]; if(n){ domains.push({ name, n, right: counts[2 * k + 1] }); tagged += n; } });
      if(tagged > total || domains.some(d => d.right > d.n)) return { why: 'damaged', who };
      const ax = S.reportAxes[j];
      axes.push({ label: ax.label, noun: ax.noun, plural: ax.plural, untagged: total - tagged, domains });
    }
    const allowed = S.timeMode === 'exam' ? (Number(S.mins) || 0) : S.timeMode === 'item' ? Math.round((Number(S.secs) || 0) * total / 60) : 0;
    return { res, rep: { axes, allowed } };
  }
  /* The verdict at the top. Each line is a list of pieces: text, or { t, cls } for a styled piece. */
  function say(ok, title, lines){
    const box = $('check');
    box.className = 'box check ' + (ok ? 'ok' : 'bad');
    box.textContent = '';
    const h = document.createElement('h1');
    h.textContent = title;
    box.appendChild(h);
    lines.forEach(parts => {
      const p = document.createElement('p');
      parts.forEach(x => {
        if(typeof x === 'string'){ p.appendChild(document.createTextNode(x)); return; }
        const s = document.createElement('span'); s.className = x.cls; s.textContent = x.t; p.appendChild(s);
      });
      box.appendChild(p);
    });
    return box;
  }

  const got = read(location.hash);
  if(got.why === 'none'){
    say(false, 'No report came with this link', [['Open this page by scanning the QR code at the top of a candidate’s performance report: '
      + 'the report travels in the code, after the # of the address.']]);
    return;
  }
  if(got.why){
    say(false, got.why === 'version' ? 'This code is for another version of this page' : 'This code is incomplete', [
      [got.why === 'version'
        ? 'The report was made for version ' + got.version + ' of the report page, and this is version ' + page.id + ', so it cannot be drawn here. Ask the examiner for the page of that version.'
        : 'Part of the code is missing or damaged, so the report cannot be drawn from it. Scan it again, closer and in good light.'],
      ['Candidate: ' + (got.who.name || '—') + '. Verification code: ', { t: got.who.code || '—', cls: 'code' }, '.']]);
    return;
  }
  const m = reportModel(S, got.res, got.rep);
  const url = URL.createObjectURL(new Blob([reportPdf(m)], { type: 'application/pdf' }));
  const who = got.res.name || 'the candidate';
  const day = new Date(got.res.submitted).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  const box = say(true, m.specimen ? 'Specimen report' : 'Performance report of ' + who, [
    [m.specimen
      ? 'A specimen with made-up answers, from the examiner’s preview. A candidate’s report opens here the same way, drawn again from the code on it.'
      : 'This is the report ' + who + '’s exam file wrote when they submitted it on ' + day + ', drawn again from the code you scanned: '
        + 'the same PDF they were given. If a copy you hold differs from it in any detail, that copy has been changed.'],
    ['Verification code ', { t: got.res.code, cls: 'code' }, '. To confirm the result itself, ask the examiner to check this code against the result that came back to them.']]);
  const actions = document.createElement('div');
  actions.className = 'actions';
  const open = document.createElement('a');
  open.className = 'primary'; open.href = url; open.target = '_blank'; open.rel = 'noopener'; open.textContent = 'Open the PDF';
  const save = document.createElement('a');
  save.href = url; save.download = reportFileName(got.res); save.textContent = 'Download the PDF';
  actions.appendChild(open); actions.appendChild(save);
  box.appendChild(actions);
  reportDom($('report'), m, 'Performance report');
  $('report').hidden = false;
})();
</script>
